name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daymark/core test
      - run: pnpm --filter @daymark/importers test
      - run: pnpm --filter @daymark/desktop typecheck
      - run: pnpm --filter @daymark/web typecheck
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm --filter @daymark/desktop vite:build
      - run: pnpm --filter @daymark/web build
