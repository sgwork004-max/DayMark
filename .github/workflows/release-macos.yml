name: Release macOS

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.4.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daymark/core test
      - run: pnpm --filter @daymark/importers build
      - run: pnpm --filter @daymark/desktop typecheck
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || 'v__VERSION__' }}
          releaseName: "Manager v__VERSION__"
          releaseBody: "See INSTALL.md for the scoped macOS install command and CHANGELOG.md for release details. This build is ad hoc signed and is not Apple notarized."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app,dmg
