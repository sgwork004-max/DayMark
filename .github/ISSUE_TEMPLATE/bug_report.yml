name: Bug report
description: Something in Manager does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private note contents, API keys or tokens. Report security problems through [private vulnerability reporting](https://github.com/sgwork004-max/manager/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open today's note
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Manager version
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.1, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional. Settings > About > Create diagnostics saves a report without note contents.
