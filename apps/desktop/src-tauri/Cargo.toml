[package]
name = "daymark-desktop"
version = "0.6.1"
description = "DayMark - local notes, tasks, and calendar"
authors = []
edition = "2021"

[lib]
name = "daymark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "daymark-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
notify    = { version = "6", features = [] }
tauri-plugin-notification = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
